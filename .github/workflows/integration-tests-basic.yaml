name: Local integration tests - Basic Version

on:
  pull_request:
    branches: [main]

jobs:
  basic-integration-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, windows-2022]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [20]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install packages
        run: pnpm install
      - name: Allow running mkcert on Mac
        run: sudo security authorizationdb write com.apple.trust-settings.admin allow
        if: runner.os == 'macOS'
      - name: Install mkcert
        run: brew install mkcert
        if: runner.os == 'macOS'
      - name: Run mkcert setup [mkcert -install]
        run: mkcert -install
        if: runner.os == 'macOS'
      - name: Install https cert [pnpm setup:https]
        run: pnpm setup:https
        if: runner.os == 'macOS'
      - run: |
          mkdir certs
          .\scripts\generate-cert.ps1
        shell: pwsh
        if: runner.os == 'Windows'
      - name: Run integration tests
        run: pnpm test:integration
        shell: bash
